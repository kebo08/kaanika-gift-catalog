<script>(() => {
  'use strict';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const data = CATALOG, combos = data.combos, products = data.products;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const money = n => '₹' + n.toLocaleString('en-IN');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const animated = !!(window.gsap && window.ScrollTrigger) && !reduced;
  if (!animated) document.documentElement.classList.add('static');
  if (animated) gsap.registerPlugin(ScrollTrigger);
  let current = Math.max(0, combos.findIndex(c => '#' + c.id === location.hash));
  let timeline, starts = [], finalTime = 0;
  const cover = $('#cover'), copy = $('#copy'), art = $('#art');
  function items(c) { return c.items.map(id => ({...products[id], id})); }
  function render() {
    const c = combos[current], all = items(c), n = all.length;
    cover.inert=false;cover.setAttribute('aria-hidden','false');
    $$('.tabs button').forEach((t,i) => {t.setAttribute('aria-selected',String(i===current));t.tabIndex=i===current?0:-1;});
    $('#catalog-view').setAttribute('aria-labelledby','tab-'+c.id);
    cover.innerHTML = `<div><p class="index">KAANIKA.GIFTS · GIFT COMBO <b>No. ${c.no}</b></p><h1>Combo <em>${c.no}</em></h1><p class="lede">${esc(c.lede)}</p><p class="price">Selling price <b>${money(c.price)}</b></p><div class="hint"><i></i>Scroll to unpack</div></div><nav aria-label="Combo ${c.no} contents"><ol class="contents">${all.map((p,i)=>`<li><button type="button" data-goto="${i}"><img src="${p.image}" alt="" width="44" height="44"><span class="t">${esc(p.name)}</span><span class="n">${pad(i+1)}</span></button></li>`).join('')}<li><button type="button" data-goto="final"><span class="bagicon"><svg width="28" height="30" viewBox="0 0 28 30" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 10h18l2 18H3L5 10Z"/><path d="M9 11V7a5 5 0 0 1 10 0v4"/></svg></span><span class="t">The complete combo</span><span class="n">↗</span></button></li></ol></nav>`;
    copy.innerHTML = all.map((p,i)=>`<article class="panel" id="product-${i}">${!animated?`<img class="static-photo" src="${p.image}" alt="${esc(p.name)}${p.illustrative?' — illustrative preview':''}">`:''}<p class="index"><b>${pad(i+1)}</b> / ${pad(n)}</p><h2>${esc(p.name)}</h2><p class="lede">${esc(p.copy)}</p><dl class="specs">${p.specs.map(s=>`<dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd>`).join('')}</dl></article>`).join('') + `<article class="panel finale" id="complete-combo">${!animated?`<img class="static-photo" src="${products[c.bag].image}" alt="${c.bag==='gift-bag'?'Gift bag illustration':'Laptop bag'}">`:''}<p class="index"><b>The complete combo</b></p><h2>${['Zero','One','Two','Three','Four','Five'][n]} pieces,<br><em>one gesture.</em></h2><p class="lede">${c.bag==='gift-bag'?'Every piece, with a thank you card and a bag to bring it all together.':'Useful essentials, a note of thanks, and a laptop bag for wherever the day takes you.'}</p><ul class="list">${all.map((p,i)=>`<li>${esc(p.name)}<span>${pad(i+1)}</span></li>`).join('')}</ul><p class="price">Selling price <b>${money(c.price)}</b></p>${all.some(p=>p.illustrative)?'<p class="small-note">Bag and game illustrations are indicative where shown.</p>':''}<div class="actions"><button class="btn" type="button" id="replay">Back to the cover</button><button class="btn ghost" type="button" id="next">Next combo ↗</button></div></article>`;
    art.innerHTML = `<div class="disc"></div><div class="packaging ${c.bag==='laptop-bag'?'laptop':''}"><img src="${products[c.bag].image}" alt=""><span class="packaging-caption">${c.bag==='gift-bag'?'kaanika.gifts · illustrative bag preview':'kaanika.gifts · carry something thoughtful'}</span></div>${all.map((p,i)=>`<div class="actor ${p.id==='vacuum-bottle'?'tall':''}" data-item="${i}"><img src="${p.image}" alt=""></div>`).join('')}`;
    $('#dock').innerHTML = '<span class="dock-label">In your combo</span>'+all.map((_,i)=>`<div class="dock-slot">${pad(i+1)}</div>`).join('');
    $('#counter').innerHTML = animated?'<b>Contents</b>':`<b>Combo ${c.no}</b>`;
    if (!animated) { $$('.panel').forEach(p=>p.classList.add('active')); return; }
    $('.story').style.height = (420 + n * 170) + 'svh';
    build(c, all);
  }
  function build(c, all) {
    const actors = $$('.actor'), panels = $$('.panel'), dock = $('#dock'), disc = $('.disc'), pack = $('.packaging');
    const width = () => art.clientWidth, height = () => art.clientHeight;
    const dockPos = i => {const r=$$('.dock-slot')[i].getBoundingClientRect(),a=art.getBoundingClientRect();return {x:r.x+r.width/2-a.x-a.width/2,y:r.y+r.height/2-a.y-a.height/2,scale:r.width/actors[i].offsetWidth*.9};};
    starts = [];
    let lastLabel = '';
    timeline = gsap.timeline({defaults:{ease:'none'},onUpdate:()=>{
      $('#bar').style.transform=`scaleX(${timeline ? timeline.progress() : 0})`;
      const time=timeline?timeline.time():0;
      let active=-1; starts.forEach((t,i)=>{if(time>=t+.2)active=i;});
      const finale=time>=finalTime+.2;
      const label=finale?'<b>The combo</b>':active<0?'<b>Contents</b>':`<b>${pad(active+1)}</b> / ${pad(all.length)}`;
      if (label !== lastLabel) { $('#counter').innerHTML=label; lastLabel=label; }
      panels.forEach((p,i)=>{const isActive=finale?i===all.length:i===active;p.classList.toggle('active',isActive);p.inert=!isActive;p.setAttribute('aria-hidden',String(!isActive));});
      cover.inert=time>.8;cover.setAttribute('aria-hidden',String(time>.8));
    },scrollTrigger:{trigger:'.story',start:'top top',end:'bottom bottom',scrub:.65,invalidateOnRefresh:true}});
    timeline.fromTo(cover,{yPercent:0,autoAlpha:1},{yPercent:-8,autoAlpha:0,duration:.8},.1);
    timeline.fromTo(dock,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.5},.8);
    all.forEach((p,i)=>{
      const t=.7+i*2.4;starts.push(t);
      timeline.fromTo(actors[i],{x:()=>width()*1.3,y:()=>height()*-.7,rotation:i%2?14:-14,scale:.72,autoAlpha:0},{x:0,y:0,rotation:0,scale:1,autoAlpha:1,duration:1,ease:'power3.out'},t);
      timeline.fromTo(disc,{autoAlpha:0,scale:.8},{autoAlpha:1,scale:1,duration:.6},t+.1);
      timeline.fromTo(panels[i],{autoAlpha:0,y:35},{autoAlpha:1,y:0,duration:.6},t+.3);
      timeline.to(panels[i],{autoAlpha:0,y:-25,duration:.45},t+1.8);
      timeline.to(disc,{autoAlpha:0,duration:.5},t+1.8);
      timeline.to(actors[i],{x:()=>dockPos(i).x,y:()=>dockPos(i).y,scale:()=>dockPos(i).scale,rotation:0,duration:.8,ease:'power2.inOut'},t+1.8);
    });
    finalTime=.7+all.length*2.4+.3;
    timeline.fromTo(pack,{y:()=>height()*.55,autoAlpha:0,scale:.8},{y:0,autoAlpha:1,scale:1,duration:1.2,ease:'power3.out'},finalTime);
    timeline.fromTo(panels[all.length],{autoAlpha:0,y:35},{autoAlpha:1,y:0,duration:.7},finalTime+.3);
    all.forEach((p,i)=>{
      const isBag=p.id===c.bag;
      timeline.to(actors[i],{x:()=>((i-(all.length-1)/2)*width()*.2),y:()=>height()*.32,scale:.18,autoAlpha:isBag?0:1,rotation:i%2?5:-5,duration:1,ease:'power2.inOut'},finalTime+.5+i*.1);
    });
    timeline.to(dock,{autoAlpha:0,duration:.5},finalTime+.6);
    timeline.to({}, {duration:1.6});
    panels.forEach(p=>{p.inert=true;p.setAttribute('aria-hidden','true');});
  }
  function jump(target) {
    if (!animated) {$(target==='final'?'#complete-combo':'#product-'+target).scrollIntoView({behavior:'auto',block:'start'});return;}
    const time = target==='final'?timeline.duration()-.15:starts[Number(target)]+1.4;
    const st=timeline.scrollTrigger;
    window.scrollTo({top:st.start+time/timeline.duration()*(st.end-st.start),behavior:'smooth'});
  }
  function select(i,focus=false) {
    if(i<0||i>=combos.length||i===current)return;
    if(timeline){timeline.scrollTrigger.kill();timeline.kill();timeline=null;}
    current=i;window.scrollTo({top:0,behavior:'instant'});
    render();
    history.replaceState(null,'','#'+combos[i].id);
    if(animated) ScrollTrigger.refresh();
    if(focus) $('#tab-'+combos[i].id).focus();
  }
  document.addEventListener('click',e=>{
    const tab=e.target.closest('[data-combo]');if(tab){select(+tab.dataset.combo);return;}
    const go=e.target.closest('[data-goto]');if(go){jump(go.dataset.goto);return;}
    if(e.target.closest('#replay')){window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});return;}
    if(e.target.closest('#next'))select((current+1)%combos.length,true);
  });
  $('.tabs').addEventListener('keydown',e=>{
    const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();
    const i=e.key==='Home'?0:e.key==='End'?combos.length-1:(current+(e.key==='ArrowRight'?1:-1)+combos.length)%combos.length;
    select(i,true);
  });
  window.addEventListener('hashchange',()=>{const i=combos.findIndex(c=>'#'+c.id===location.hash);if(i>=0)select(i);});
  render();
  if(animated){window.addEventListener('load',()=>ScrollTrigger.refresh());document.fonts?.ready.then(()=>ScrollTrigger.refresh());}
})();
</script>
</body></html>
